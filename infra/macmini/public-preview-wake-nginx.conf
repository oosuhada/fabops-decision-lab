worker_processes 1;

events { worker_connections 256; }

http {
    server_tokens off;

    map $http_cf_connecting_ip $fabops_preview_client {
        default $http_cf_connecting_ip;
        "" $binary_remote_addr;
    }

    limit_req_zone $fabops_preview_client zone=fabops_preview:10m rate=30r/s;
    limit_req_zone $fabops_preview_client zone=fabops_ai_demo:10m rate=6r/m;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 8k;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-FabOps-Preview-Mode "read-only-with-bounded-ai" always;
        add_header X-FabOps-Preview-Candidate "v0.7" always;

        limit_req zone=fabops_preview burst=60 nodelay;

        # Internal-only activity signal. The host supervisor is bound to
        # 127.0.0.1 and accepts only fixed wake/sleep/status operations.
        location = /__fabops_activity {
            internal;
            proxy_pass http://host.docker.internal:8231/activity;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_connect_timeout 500ms;
            proxy_read_timeout 2s;
        }

        location @starting {
            default_type text/html;
            add_header Cache-Control "no-store" always;
            add_header Retry-After "3" always;
            add_header X-FabOps-Wake-State "starting" always;
            return 200 '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="3"><title>FabOps Preview starting</title><style>html{color-scheme:dark}body{margin:0;background:#090b10;color:#e8ebf2;font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;display:grid;min-height:100vh;place-items:center}.card{width:min(620px,calc(100vw - 48px));border:1px solid #29303d;border-radius:12px;padding:28px;background:#0f131b}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8d98aa}h1{font:600 23px/1.25 system-ui,sans-serif;margin:8px 0 12px}.bar{height:3px;background:#222a37;overflow:hidden;margin-top:22px}.bar:after{content:"";display:block;width:35%;height:100%;background:#b8c7e6;animation:m 1.2s infinite ease-in-out}@keyframes m{from{transform:translateX(-110%)}to{transform:translateX(320%)}}</style></head><body><main class="card"><div class="eyebrow">FabOps Decision Lab · public preview</div><h1>Preview environment is starting</h1><div>The runtime sleeps after 45 minutes without traffic. This page will reconnect automatically when the preview is ready.</div><div class="bar"></div></main></body></html>';
        }

        location @starting_api {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Retry-After "3" always;
            return 503 '{"status":"starting","retry_after_seconds":3}';
        }

        # Only this exact POST is Internet-reachable. It accepts no free-form
        # prompt and is gated again by server-owned session/rate/provider budgets.
        location = /api/demo/narration {
            if ($request_method != POST) { return 405; }
            limit_req zone=fabops_ai_demo burst=2 nodelay;
            auth_request /__fabops_activity;
            proxy_intercept_errors on;
            error_page 502 503 504 = @starting_api;
            proxy_pass http://host.docker.internal:8250;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 55s;
        }

        location / {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            auth_request /__fabops_activity;
            proxy_intercept_errors on;
            error_page 502 503 504 =200 @starting;
            proxy_pass http://host.docker.internal:8250;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }
    }
}

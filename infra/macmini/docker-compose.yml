name: fabops-decision-lab-macmini

x-release-labels: &release-labels
  org.opencontainers.image.version: ${FABOPS_RELEASE_VERSION:-0.6.0}
  org.opencontainers.image.revision: ${FABOPS_DEPLOY_GIT_SHA:?FABOPS_DEPLOY_GIT_SHA must be set}
  com.oosu.fabops.release-hash: ${FABOPS_RELEASE_HASH:?FABOPS_RELEASE_HASH must be set}

x-api-environment: &api-environment
  FABOPS_RUNTIME_MODE: integration
  FABOPS_POSTGRES_DSN: postgresql://fabops:${FABOPS_POSTGRES_PASSWORD:?FABOPS_POSTGRES_PASSWORD must be set}@postgres:5432/fabops
  FABOPS_REDPANDA_BOOTSTRAP: redpanda:9092
  FABOPS_REDPANDA_TOPIC: fabops.events.v1
  FABOPS_REDPANDA_DLQ_TOPIC: fabops.events.dlq.v1
  FABOPS_REDPANDA_GROUP: fabops-macmini-api-v1
  FABOPS_NEO4J_URI: bolt://neo4j:7687
  FABOPS_NEO4J_USER: neo4j
  FABOPS_NEO4J_PASSWORD: ${FABOPS_NEO4J_PASSWORD:?FABOPS_NEO4J_PASSWORD must be set}

services:
  postgres:
    image: postgres:16-alpine
    labels: *release-labels
    restart: unless-stopped
    cpus: 0.75
    mem_limit: 640m
    environment:
      POSTGRES_DB: fabops
      POSTGRES_USER: fabops
      POSTGRES_PASSWORD: ${FABOPS_POSTGRES_PASSWORD:?FABOPS_POSTGRES_PASSWORD must be set}
    volumes:
      - ${FABOPS_DATA_ROOT:?FABOPS_DATA_ROOT must be set}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabops -d fabops"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks: [private]

  redpanda:
    image: redpandadata/redpanda:v24.3.18
    labels: *release-labels
    restart: unless-stopped
    cpus: 0.75
    mem_limit: 768m
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    volumes:
      - ${FABOPS_DATA_ROOT:?FABOPS_DATA_ROOT must be set}/redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [private]

  redpanda-init:
    image: redpandadata/redpanda:v24.3.18
    labels: *release-labels
    restart: "no"
    cpus: 0.25
    mem_limit: 128m
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      rpk topic create fabops.events.v1 --brokers redpanda:9092 || true;
      rpk topic create fabops.events.dlq.v1 --brokers redpanda:9092 || true
    networks: [private]

  neo4j:
    image: neo4j:5.26-community
    labels: *release-labels
    restart: unless-stopped
    cpus: 0.75
    mem_limit: 768m
    environment:
      NEO4J_AUTH: neo4j/${FABOPS_NEO4J_PASSWORD:?FABOPS_NEO4J_PASSWORD must be set}
      FABOPS_NEO4J_PASSWORD: ${FABOPS_NEO4J_PASSWORD:?FABOPS_NEO4J_PASSWORD must be set}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - ${FABOPS_DATA_ROOT:?FABOPS_DATA_ROOT must be set}/neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$FABOPS_NEO4J_PASSWORD\" 'RETURN 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [private]

  init:
    build:
      context: ../..
      dockerfile: infra/macmini/Dockerfile.api
      args:
        FABOPS_RELEASE_VERSION: ${FABOPS_RELEASE_VERSION:-0.6.0}
        FABOPS_RELEASE_HASH: ${FABOPS_RELEASE_HASH}
        FABOPS_DEPLOY_GIT_SHA: ${FABOPS_DEPLOY_GIT_SHA}
    labels: *release-labels
    restart: "no"
    cpus: 0.5
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    environment: *api-environment
    command: ["/bin/sh", "-ec", "python -m adapters.postgres.migrate && python -m evaluation.m7_init --check"]
    networks: [private]

  api:
    build:
      context: ../..
      dockerfile: infra/macmini/Dockerfile.api
      args:
        FABOPS_RELEASE_VERSION: ${FABOPS_RELEASE_VERSION:-0.6.0}
        FABOPS_RELEASE_HASH: ${FABOPS_RELEASE_HASH}
        FABOPS_DEPLOY_GIT_SHA: ${FABOPS_DEPLOY_GIT_SHA}
    labels: *release-labels
    restart: unless-stopped
    cpus: 0.75
    mem_limit: 640m
    depends_on:
      init:
        condition: service_completed_successfully
    environment: *api-environment
    ports:
      - "127.0.0.1:${FABOPS_API_PORT:-8210}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)); raise SystemExit(0 if d.get('ready') else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      private:
        aliases: [api]

  web:
    build:
      context: ../..
      dockerfile: infra/macmini/Dockerfile.web
      args:
        FABOPS_RELEASE_VERSION: ${FABOPS_RELEASE_VERSION:-0.6.0}
        FABOPS_RELEASE_HASH: ${FABOPS_RELEASE_HASH}
        FABOPS_DEPLOY_GIT_SHA: ${FABOPS_DEPLOY_GIT_SHA}
        VITE_API_URL: ""
    labels: *release-labels
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FABOPS_WEB_PORT:-8220}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [private]

networks:
  private:
    name: fabops-decision-lab-macmini_private
    driver: bridge

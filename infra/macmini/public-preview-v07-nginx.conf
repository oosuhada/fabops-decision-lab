worker_processes 1;

events {
    worker_connections 256;
}

http {
    server_tokens off;

    map $http_cf_connecting_ip $fabops_preview_client {
        default $http_cf_connecting_ip;
        "" $binary_remote_addr;
    }

    limit_req_zone $fabops_preview_client zone=fabops_preview:10m rate=30r/s;

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-FabOps-Preview-Mode "read-only" always;
        add_header X-FabOps-Preview-Candidate "v0.7" always;

        limit_req zone=fabops_preview burst=60 nodelay;

        location / {
            # Public candidate remains GET/HEAD only. The v0.7 UI can display
            # workflow controls for portfolio review, but anonymous traffic may
            # not reach any mutating API route.
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }

            proxy_pass http://host.docker.internal:8250;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-FabOps-Preview-Mode "read-only";
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }
    }
}

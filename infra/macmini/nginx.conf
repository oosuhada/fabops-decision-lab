server {
    listen 80;
    server_name _;

    # Docker service IPs can change when the API container is recreated.
    # Resolve the service name at request time instead of pinning the IP that
    # existed when nginx first started.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fabops_api_upstream api:8000;

    root /usr/share/nginx/html;
    index index.html;

    location = /health/live {
        default_type application/json;
        return 200 '{"status":"alive","service":"fabops-web"}';
    }

    location /api/ {
        proxy_pass http://$fabops_api_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

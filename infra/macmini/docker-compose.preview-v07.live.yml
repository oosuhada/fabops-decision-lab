services:
  api:
    environment:
      FABOPS_DATA_SOURCE: database
      FABOPS_LIVE_ENABLED: "true"
      FABOPS_GRAPH_WINDOW_LOTS: ${FABOPS_GRAPH_WINDOW_LOTS:-250}
      FABOPS_POSTGRES_DSN: postgresql://fabops:${FABOPS_LIVE_POSTGRES_PASSWORD:?FABOPS_LIVE_POSTGRES_PASSWORD must be set}@live-postgres:5432/fabops
    depends_on:
      live-init:
        condition: service_completed_successfully

  live-postgres:
    profiles: ["live"]
    image: postgres:16-alpine
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    environment:
      POSTGRES_DB: fabops
      POSTGRES_USER: fabops
      POSTGRES_PASSWORD: ${FABOPS_LIVE_POSTGRES_PASSWORD:?FABOPS_LIVE_POSTGRES_PASSWORD must be set}
    volumes:
      - ${FABOPS_LIVE_DATA_ROOT:?FABOPS_LIVE_DATA_ROOT must be set}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabops -d fabops"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks: [preview]

  live-redpanda:
    profiles: ["live"]
    image: redpandadata/redpanda:v24.3.18
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 384M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://live-redpanda:9092
    volumes:
      - ${FABOPS_LIVE_DATA_ROOT:?FABOPS_LIVE_DATA_ROOT must be set}/redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [preview]

  live-redpanda-init:
    profiles: ["live"]
    image: redpandadata/redpanda:v24.3.18
    restart: "no"
    cpus: 0.2
    mem_limit: 128m
    depends_on:
      live-redpanda:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        rpk topic create fabops.events.v1 --brokers live-redpanda:9092 || true;
        rpk topic create fabops.events.dlq.v1 --brokers live-redpanda:9092 || true
    networks: [preview]

  live-init:
    profiles: ["live"]
    build:
      context: ${FABOPS_PUBLIC_SOURCE_ROOT:?FABOPS_PUBLIC_SOURCE_ROOT must be set}
      dockerfile: infra/macmini/Dockerfile.api
      args:
        FABOPS_RELEASE_VERSION: ${FABOPS_CANDIDATE_LABEL:-0.6.0-v0.8-live-candidate}
        FABOPS_RELEASE_HASH: ${FABOPS_BASE_RELEASE_HASH:-ab8b20a696b9b1996495f23a3e413cc33a67b6861efa184c64742e0f310c6326}
        FABOPS_DEPLOY_GIT_SHA: ${FABOPS_PUBLIC_GIT_SHA}
        FABOPS_BASE_RELEASE_VERSION: ${FABOPS_BASE_RELEASE_VERSION:-0.6.0}
        FABOPS_DEPLOYMENT_KIND: candidate
        FABOPS_DEPLOYMENT_CHANNEL: public-preview
        FABOPS_CANDIDATE_LABEL: ${FABOPS_CANDIDATE_LABEL:-0.6.0-v0.8-live-candidate}
        FABOPS_DEPLOYMENT_HASH: candidate-${FABOPS_PUBLIC_GIT_SHA}
    restart: "no"
    cpus: 0.4
    mem_limit: 384m
    depends_on:
      live-postgres:
        condition: service_healthy
      live-redpanda-init:
        condition: service_completed_successfully
    environment: &live-integration-environment
      FABOPS_POSTGRES_DSN: postgresql://fabops:${FABOPS_LIVE_POSTGRES_PASSWORD}@live-postgres:5432/fabops
      FABOPS_REDPANDA_BOOTSTRAP: live-redpanda:9092
      FABOPS_REDPANDA_TOPIC: fabops.events.v1
      FABOPS_REDPANDA_DLQ_TOPIC: fabops.events.dlq.v1
      FABOPS_REDPANDA_GROUP: fabops-preview-live-bootstrap-v1
      FABOPS_LIVE_SEED: ${FABOPS_LIVE_SEED:-42}
      FABOPS_LIVE_PROFILE: ${FABOPS_LIVE_PROFILE:-test}
    command: ["/bin/sh", "-ec", "python -m adapters.postgres.migrate && python -m systems.live_worker.bootstrap"]
    networks: [preview]

  live-simulator:
    profiles: ["live"]
    build:
      context: ${FABOPS_PUBLIC_SOURCE_ROOT:?FABOPS_PUBLIC_SOURCE_ROOT must be set}
      dockerfile: infra/macmini/Dockerfile.api
      args:
        FABOPS_RELEASE_VERSION: ${FABOPS_CANDIDATE_LABEL:-0.6.0-v0.8-live-candidate}
        FABOPS_RELEASE_HASH: ${FABOPS_BASE_RELEASE_HASH:-ab8b20a696b9b1996495f23a3e413cc33a67b6861efa184c64742e0f310c6326}
        FABOPS_DEPLOY_GIT_SHA: ${FABOPS_PUBLIC_GIT_SHA}
        FABOPS_BASE_RELEASE_VERSION: ${FABOPS_BASE_RELEASE_VERSION:-0.6.0}
        FABOPS_DEPLOYMENT_KIND: candidate
        FABOPS_DEPLOYMENT_CHANNEL: public-preview
        FABOPS_CANDIDATE_LABEL: ${FABOPS_CANDIDATE_LABEL:-0.6.0-v0.8-live-candidate}
        FABOPS_DEPLOYMENT_HASH: candidate-${FABOPS_PUBLIC_GIT_SHA}
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 256m
    depends_on:
      live-init:
        condition: service_completed_successfully
    environment:
      FABOPS_REDPANDA_BOOTSTRAP: live-redpanda:9092
      FABOPS_REDPANDA_TOPIC: fabops.events.v1
      FABOPS_REDPANDA_DLQ_TOPIC: fabops.events.dlq.v1
      FABOPS_POSTGRES_DSN: postgresql://fabops:${FABOPS_LIVE_POSTGRES_PASSWORD}@live-postgres:5432/fabops
      FABOPS_LIVE_SEED: ${FABOPS_LIVE_SEED:-42}
      FABOPS_LIVE_PROFILE: ${FABOPS_LIVE_PROFILE:-test}
      FABOPS_LIVE_TIME_ACCELERATION: ${FABOPS_LIVE_TIME_ACCELERATION:-720}
    command: ["python", "-m", "systems.live_worker.main"]
    networks: [preview]

  stream-worker:
    profiles: ["live"]
    build:
      context: ${FABOPS_PUBLIC_SOURCE_ROOT:?FABOPS_PUBLIC_SOURCE_ROOT must be set}
      dockerfile: infra/macmini/Dockerfile.api
      args:
        FABOPS_RELEASE_VERSION: ${FABOPS_CANDIDATE_LABEL:-0.6.0-v0.8-live-candidate}
        FABOPS_RELEASE_HASH: ${FABOPS_BASE_RELEASE_HASH:-ab8b20a696b9b1996495f23a3e413cc33a67b6861efa184c64742e0f310c6326}
        FABOPS_DEPLOY_GIT_SHA: ${FABOPS_PUBLIC_GIT_SHA}
        FABOPS_BASE_RELEASE_VERSION: ${FABOPS_BASE_RELEASE_VERSION:-0.6.0}
        FABOPS_DEPLOYMENT_KIND: candidate
        FABOPS_DEPLOYMENT_CHANNEL: public-preview
        FABOPS_CANDIDATE_LABEL: ${FABOPS_CANDIDATE_LABEL:-0.6.0-v0.8-live-candidate}
        FABOPS_DEPLOYMENT_HASH: candidate-${FABOPS_PUBLIC_GIT_SHA}
    restart: unless-stopped
    cpus: 0.4
    mem_limit: 384m
    depends_on:
      live-init:
        condition: service_completed_successfully
    environment:
      <<: *live-integration-environment
      FABOPS_REDPANDA_GROUP: fabops-preview-live-stream-v1
      FABOPS_STREAM_PROJECTION_MODE: postgres-only
    command: ["python", "-m", "systems.stream_worker.main"]
    networks: [preview]

  intelligence-worker:
    profiles: ["live"]
    build:
      context: ${FABOPS_PUBLIC_SOURCE_ROOT:?FABOPS_PUBLIC_SOURCE_ROOT must be set}
      dockerfile: infra/macmini/Dockerfile.api
      args:
        FABOPS_RELEASE_VERSION: ${FABOPS_CANDIDATE_LABEL:-0.6.0-v0.9-intelligence-candidate}
        FABOPS_RELEASE_HASH: ${FABOPS_BASE_RELEASE_HASH:-ab8b20a696b9b1996495f23a3e413cc33a67b6861efa184c64742e0f310c6326}
        FABOPS_DEPLOY_GIT_SHA: ${FABOPS_PUBLIC_GIT_SHA}
        FABOPS_BASE_RELEASE_VERSION: ${FABOPS_BASE_RELEASE_VERSION:-0.6.0}
        FABOPS_DEPLOYMENT_KIND: candidate
        FABOPS_DEPLOYMENT_CHANNEL: public-preview
        FABOPS_CANDIDATE_LABEL: ${FABOPS_CANDIDATE_LABEL:-0.6.0-v0.9-intelligence-candidate}
        FABOPS_DEPLOYMENT_HASH: candidate-${FABOPS_PUBLIC_GIT_SHA}
    restart: unless-stopped
    cpus: 0.55
    mem_limit: 512m
    depends_on:
      live-init:
        condition: service_completed_successfully
      live-postgres:
        condition: service_healthy
    environment:
      FABOPS_POSTGRES_DSN: postgresql://fabops:${FABOPS_LIVE_POSTGRES_PASSWORD}@live-postgres:5432/fabops
      FABOPS_DATA_SOURCE: database
      FABOPS_LIVE_ENABLED: "true"
      FABOPS_GIT_SHA: ${FABOPS_PUBLIC_GIT_SHA}
      FABOPS_INTELLIGENCE_INTERVAL_SECONDS: ${FABOPS_INTELLIGENCE_INTERVAL_SECONDS:-30}
      FABOPS_RETRAIN_EVERY_OUTCOMES: ${FABOPS_RETRAIN_EVERY_OUTCOMES:-6}
      FABOPS_LLM_REPORT_INTERVAL_SECONDS: ${FABOPS_LLM_REPORT_INTERVAL_SECONDS:-300}
      FABOPS_LLM_REPORT_CASE_LIMIT: ${FABOPS_LLM_REPORT_CASE_LIMIT:-2}
    command: ["python", "-m", "systems.intelligence_worker.main"]
    networks: [preview]

  inference-worker:
    profiles: ["live"]
    build:
      context: ${FABOPS_PUBLIC_SOURCE_ROOT:?FABOPS_PUBLIC_SOURCE_ROOT must be set}
      dockerfile: infra/macmini/Dockerfile.api
      args:
        FABOPS_RELEASE_VERSION: ${FABOPS_CANDIDATE_LABEL:-0.6.0-v0.9-intelligence-candidate}
        FABOPS_RELEASE_HASH: ${FABOPS_BASE_RELEASE_HASH:-ab8b20a696b9b1996495f23a3e413cc33a67b6861efa184c64742e0f310c6326}
        FABOPS_DEPLOY_GIT_SHA: ${FABOPS_PUBLIC_GIT_SHA}
        FABOPS_BASE_RELEASE_VERSION: ${FABOPS_BASE_RELEASE_VERSION:-0.6.0}
        FABOPS_DEPLOYMENT_KIND: candidate
        FABOPS_DEPLOYMENT_CHANNEL: public-preview
        FABOPS_CANDIDATE_LABEL: ${FABOPS_CANDIDATE_LABEL:-0.6.0-v0.9-intelligence-candidate}
        FABOPS_DEPLOYMENT_HASH: candidate-${FABOPS_PUBLIC_GIT_SHA}
    restart: unless-stopped
    cpus: 0.35
    mem_limit: 384m
    depends_on:
      live-init:
        condition: service_completed_successfully
      live-postgres:
        condition: service_healthy
    environment:
      FABOPS_POSTGRES_DSN: postgresql://fabops:${FABOPS_LIVE_POSTGRES_PASSWORD}@live-postgres:5432/fabops
      FABOPS_INFERENCE_QUEUE_POLL_SECONDS: ${FABOPS_INFERENCE_QUEUE_POLL_SECONDS:-1.5}
      FABOPS_INFERENCE_LEASE_SECONDS: ${FABOPS_INFERENCE_LEASE_SECONDS:-120}
      FABOPS_NARRATION_MODE: ${FABOPS_NARRATION_MODE:-auto}
      FABOPS_LOCAL_LLM_ENABLED: ${FABOPS_LOCAL_LLM_ENABLED:-true}
      FABOPS_LOCAL_LLM_BASE_URL: ${FABOPS_LOCAL_LLM_BASE_URL}
      FABOPS_LOCAL_LLM_MODEL: ${FABOPS_LOCAL_LLM_MODEL:-local-review-qwen-next}
      FABOPS_LOCAL_LLM_TOKEN: ${FABOPS_LOCAL_LLM_TOKEN}
      FABOPS_LOCAL_LLM_TIMEOUT_SECONDS: ${FABOPS_LOCAL_LLM_TIMEOUT_SECONDS:-45}
      FABOPS_LOCAL_LLM_MAX_RPM: ${FABOPS_LOCAL_LLM_MAX_RPM:-20}
      FABOPS_LOCAL_LLM_MAX_CONCURRENCY: "1"
      FABOPS_LOCAL_LLM_DAILY_REQUEST_LIMIT: ${FABOPS_LOCAL_LLM_DAILY_REQUEST_LIMIT:-500}
      FABOPS_LOCAL_LLM_DAILY_ESTIMATED_TOKEN_LIMIT: ${FABOPS_LOCAL_LLM_DAILY_ESTIMATED_TOKEN_LIMIT:-1000000}
      FABOPS_LOCAL_LLM_CIRCUIT_FAILURE_THRESHOLD: ${FABOPS_LOCAL_LLM_CIRCUIT_FAILURE_THRESHOLD:-3}
      FABOPS_LOCAL_LLM_CIRCUIT_COOLDOWN_SECONDS: ${FABOPS_LOCAL_LLM_CIRCUIT_COOLDOWN_SECONDS:-60}
      FABOPS_LOCAL_LLM_MAX_OUTPUT_TOKENS: ${FABOPS_LOCAL_LLM_MAX_OUTPUT_TOKENS:-700}
      FABOPS_VERTEX_ENABLED: ${FABOPS_VERTEX_ENABLED:-true}
      FABOPS_VERTEX_PROJECT: ${FABOPS_VERTEX_PROJECT}
      FABOPS_VERTEX_LOCATION: ${FABOPS_VERTEX_LOCATION:-global}
      FABOPS_VERTEX_MODEL: ${FABOPS_VERTEX_MODEL:-gemini-2.5-flash-lite}
      FABOPS_VERTEX_AUTH_MODE: ${FABOPS_VERTEX_AUTH_MODE:-adc}
      FABOPS_VERTEX_MAX_RPM: ${FABOPS_VERTEX_MAX_RPM:-6}
      FABOPS_VERTEX_MAX_CONCURRENCY: ${FABOPS_VERTEX_MAX_CONCURRENCY:-1}
      FABOPS_VERTEX_DAILY_REQUEST_LIMIT: ${FABOPS_VERTEX_DAILY_REQUEST_LIMIT:-50}
      FABOPS_VERTEX_DAILY_ESTIMATED_TOKEN_LIMIT: ${FABOPS_VERTEX_DAILY_ESTIMATED_TOKEN_LIMIT:-120000}
      FABOPS_VERTEX_CIRCUIT_FAILURE_THRESHOLD: ${FABOPS_VERTEX_CIRCUIT_FAILURE_THRESHOLD:-2}
      FABOPS_VERTEX_CIRCUIT_COOLDOWN_SECONDS: ${FABOPS_VERTEX_CIRCUIT_COOLDOWN_SECONDS:-120}
      FABOPS_VERTEX_MAX_OUTPUT_TOKENS: ${FABOPS_VERTEX_MAX_OUTPUT_TOKENS:-900}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/vertex-adc.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:?GOOGLE_APPLICATION_CREDENTIALS must be set}:/run/secrets/vertex-adc.json:ro
    command: ["python", "-m", "systems.inference_worker.main"]
    networks: [preview]

networks:
  preview:
    name: fabops-decision-lab-preview-v07_private
    driver: bridge

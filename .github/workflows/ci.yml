name: FabOps Release Gate

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: systems/web/package-lock.json
      - name: Install frontend dependencies for browser setup
        working-directory: systems/web
        run: npm ci
      - name: Install Chromium
        working-directory: systems/web
        run: npx playwright install --with-deps chromium
      - name: Canonical verification
        run: bash scripts/verify.sh
